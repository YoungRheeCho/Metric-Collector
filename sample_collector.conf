# Metric-Collector 설정 (key=value, #으로 시작하면 주석)
# 서버 목록은 k8s API에서 자동으로 찾으므로 여기에 적지 않는다.

# k8s에서 node / edge pod 목록을 다시 읽는 주기 (초).
# HAProxy DNS(hold valid 5s)와 비슷하게 둔다. 짧을수록 새 pod를 빨리 따라가지만 API 호출이 늘어난다
refresh_interval_sec=3

# 대시보드(origin)로 node/pod 값을 보낼 주소. 없으면 보내지 않는다
#dashboard_url=http://<origin>:18080/api/central/sysinfo
